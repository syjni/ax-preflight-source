name: Source verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Verify frozen v3
        run: python -m scripts.verify_phase6_demo_v3
      - name: Verify frozen v4
        run: python -m scripts.verify_phase6_demo_v4

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: results_console
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: results_console/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build static demo
        run: npm run build:static
