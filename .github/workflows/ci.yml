name: Source verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Verify frozen v3
        run: python -m scripts.verify_phase6_demo_v3
      - name: Verify frozen v4
        run: python -m scripts.verify_phase6_demo_v4

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: results_console
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: results_console/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build static demo
        run: npm run build:static

  docker-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build reviewer image
        run: docker build --tag ax-preflight:ci .
      - name: Smoke test console, API, and bundled OCR
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:18000:8000 ax-preflight:ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" || true
          }
          trap cleanup EXIT

          capabilities=""
          for attempt in $(seq 1 90); do
            if capabilities="$(curl --fail --silent --show-error http://127.0.0.1:18000/api/capabilities)"; then
              break
            fi
            test "$(docker inspect --format '{{.State.Running}}' "$container_id")" = "true"
            sleep 1
          done
          test -n "$capabilities"
          CAPABILITIES="$capabilities" python -c "import json, os; value=json.loads(os.environ['CAPABILITIES']); assert value['mode']=='LOCAL_REVIEW'; assert value['local_file_upload']; assert value['pdf_table_extraction']; assert value['ocr_available']; assert {'kor','eng'} <= set(value['ocr_languages'])"
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet "AX Preflight"

          audit="$(curl --fail --silent --show-error \
            --form 'files=@sample_data/mini_company/scans/invoice_scan.pdf;type=application/pdf' \
            --form 'relative_paths=["review-files/invoice_scan.pdf"]' \
            --form 'display_name=Docker OCR smoke test' \
            --form 'source_root_name=review-files' \
            http://127.0.0.1:18000/api/local-datasets/upload)"
          profile="$(AUDIT="$audit" python -c "import json, os; value=json.loads(os.environ['AUDIT']); assert value['audit']['source_mode']=='UPLOAD'; assert value['audit']['files'][0]['ocr_status']=='COMPLETED'; print(value['dataset']['profile'])")"
          deleted="$(curl --fail --silent --show-error --request DELETE "http://127.0.0.1:18000/api/local-datasets/$profile")"
          DELETED="$deleted" python -c "import json, os; value=json.loads(os.environ['DELETED']); assert value['deleted']; assert value['managed_copy_deleted']; assert not value['source_files_deleted']"
